# nixpacks.toml

[phases.setup]
# Instala o ambiente base: Node, Python 3 e FFmpeg
nixPkgs = ["nodejs", "python3", "ffmpeg"]

[phases.install]
# Instala dependências do Node E instala o yt-dlp e requests via Python
# Isso garante que o comando 'yt-dlp' exista no terminal do servidor
cmds = [
    "npm ci",
    "python3 -m pip install yt-dlp requests"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"