# nixpacks.toml

[phases.setup]
# Instala Node, Python 3 e FFmpeg
nixPkgs = ["nodejs", "python3", "ffmpeg"]

[phases.install]
# Instala dependências do Node E dependências do Python (requests)
cmds = [
    "npm ci",
    "python3 -m pip install requests"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"